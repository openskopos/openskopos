name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A schema file is published when its schema-<version> tag exists.
      # A published file never changes.
      - name: Check that published schema files did not change
        run: |
          status=0
          for tag in $(git tag --list 'schema-*'); do
            file="schema/artifact/${tag#schema-}.json"
            if ! git diff --quiet "$tag" -- "$file"; then
              echo "::error file=$file::$file is published by the tag $tag and must not change. Make a new version instead."
              status=1
            fi
          done
          exit $status
      # The runner image has a stable Rust toolchain.
      - name: Check the conformance cases against the schema
        run: cargo run --locked --manifest-path conformance/runner/Cargo.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the layout of the Rust code
        run: cargo fmt --check -p skopos-core -p skopos -p skopos-wasm
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The tests run every conformance case through skopos-core and through
      # the skopos binary.
      - name: Run the tests
        run: cargo test --workspace --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      # .cargo/config.toml sets the getrandom backend for this target.
      - name: Build skopos-core for WebAssembly
        run: cargo build -p skopos-core --target wasm32-unknown-unknown --locked
      - name: Run clippy on the WebAssembly bindings
        run: cargo clippy -p skopos-wasm --target wasm32-unknown-unknown --locked -- -D warnings

  # Exports four versions of one artifact to OpenSpec, and runs the real
  # OpenSpec CLI on each: validate, then archive. The archived specs must be
  # the fixtures that the golden tests read.
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OpenSpec
        run: npm install --global @fission-ai/openspec@1.17.0
      - name: Install the skopos CLI
        run: cargo install --locked --path crates/skopos
      - name: Export, validate and archive versions 2 to 5
        run: sh crates/skopos/tests/openspec_roundtrip.sh

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the skopos CLI
        run: cargo install --locked --path crates/skopos
      - name: Run the conformance cases with the installed CLI
        run: |
          jq -r '.cases[].file | "conformance/valid/" + .' conformance/valid/index.json | xargs skopos check
          status=0
          for file in $(jq -r '.cases[].file' conformance/invalid/index.json); do
            if skopos check "conformance/invalid/$file" > /dev/null 2>&1; then
              echo "::error file=conformance/invalid/$file::skopos accepted an invalid document"
              status=1
            fi
          done
          exit $status

  # Builds the npm packages @openskopos/core and @openskopos/cli, and runs
  # the conformance cases through @openskopos/core.
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-unknown-unknown
      - name: Make sure that the package versions are the crate version
        run: node npm/check-versions.mjs
      - name: Build the WebAssembly module
        run: npm/build.sh
      - name: Run the conformance cases through @openskopos/core
        run: npm test --prefix npm/core
      # The package supports Node 20 and later.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the package tests on Node 20
        run: npm test --prefix npm/core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run the package tests on Node 24
        run: npm test --prefix npm/core
      - name: Pack the packages
        run: |
          mkdir packs
          npm pack ./npm/core --pack-destination packs
          npm pack ./npm/cli --pack-destination packs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: packs/*.tgz

  # Installs the packed packages on each platform. Runs the npm CLI and the
  # native CLI on the same files and compares the output, the exit codes and
  # the files that they write.
  npm-cli:
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: packs
      - name: Install the packed packages
        run: |
          mkdir "$RUNNER_TEMP/project"
          cd "$RUNNER_TEMP/project"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/packs/*.tgz
      - name: Build the native skopos
        run: cargo build -p skopos --release --locked
      # On Windows, the WebAssembly build joins paths with / and takes the
      # messages of file errors from Node, so the comparison runs on Linux
      # and macOS only.
      - name: Compare the npm CLI with the native CLI
        if: runner.os != 'Windows'
        run: node npm/test/compare.mjs target/release/skopos "$RUNNER_TEMP/project/node_modules/.bin/skopos"
      - name: Run npx on the packed CLI
        run: |
          native=target/release/skopos
          npx="npx --yes -p ./packs/$(cd packs && ls openskopos-core-*.tgz) -p ./packs/$(cd packs && ls openskopos-cli-*.tgz) skopos"
          files="conformance/valid/glossary-v1.json conformance/invalid/duplicate-item-id.json"
          set +e
          $native check $files > native.txt 2>&1
          echo "exit $?" >> native.txt
          $npx check $files > npx.txt 2>&1
          echo "exit $?" >> npx.txt
          set -e
          cat npx.txt
          diff native.txt npx.txt
      - name: Run the conformance cases with the npm CLI
        run: |
          skopos="$RUNNER_TEMP/project/node_modules/.bin/skopos"
          # jq on Windows ends lines with \r\n.
          jq -r '.cases[].file | "conformance/valid/" + .' conformance/valid/index.json | tr -d '\r' | xargs "$skopos" check
          status=0
          for file in $(jq -r '.cases[].file' conformance/invalid/index.json | tr -d '\r'); do
            if "$skopos" check "conformance/invalid/$file" > /dev/null 2>&1; then
              echo "::error file=conformance/invalid/$file::the npm CLI accepted an invalid document"
              status=1
            fi
          done
          exit $status
