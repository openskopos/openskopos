name: Deploy site

# The site deploys from main. A schema version is published only by pushing
# the tag schema-<version>, for example schema-0.1. Each deploy serves every
# tagged schema file exactly as it was at its tag, so later changes on main
# never change a published file.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
    tags: ["schema-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble site
        run: |
          mkdir -p _site/schema/artifact
          cp -R site/. _site/
          for tag in $(git tag --list 'schema-*'); do
            version="${tag#schema-}"
            git show "$tag:schema/artifact/$version.json" > "_site/schema/artifact/$version.json"
            echo "Published schema $version from tag $tag"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
