[package]
name = "skopos"
version = "0.1.0"
description = "Command line tool for OpenSkopos documents: check, fmt, convert, import, ids, export and diff"
keywords = ["openskopos", "cli", "specification", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anstream = "1"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
skopos-core = { version = "0.1.0", path = "../skopos-core" }
