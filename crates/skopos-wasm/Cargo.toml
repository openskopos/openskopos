[package]
name = "skopos-wasm"
version = "0.1.0"
description = "WebAssembly build of skopos-core and the skopos commands, for the npm package @openskopos/core"
publish = false
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The crate is for WebAssembly only. On other targets it is empty and has no
# dependencies.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
skopos = { version = "0.1.0", path = "../skopos" }
skopos-core = { version = "0.1.0", path = "../skopos-core" }
wasm-bindgen = "0.2"
