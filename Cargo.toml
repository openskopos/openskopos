[workspace]
members = ["crates/*", "conformance/runner"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openskopos/openskopos"
rust-version = "1.85"

[workspace.dependencies]
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
