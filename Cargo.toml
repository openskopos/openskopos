[workspace]
members = ["crates/*", "conformance/runner"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openskopos/openskopos"
rust-version = "1.85"

[workspace.dependencies]
jsonschema = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# The WebAssembly build for npm: small code, and one unit so that the
# optimizer sees all of it. `cargo build --profile wasm` uses it.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
